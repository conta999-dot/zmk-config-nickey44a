#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
# Disable central BAS fetching to avoid ZMK GATT discovery / sub_discover_params
# collision (ZMK #3156) that drops peripheral POSITION_STATE key subscription.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
# Auto TrackPoint layer (index 4) — solid red while active, base layer color when idle
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=1

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# Keep host BLE reports at the 7.5 ms minimum interval for pointing responsiveness.
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
# Do not skip connection events while the right-hand central is connected.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024

# Pointing device
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_LPPS=y
CONFIG_LPPS_JITTER_FILTER=y
CONFIG_LPPS_SAMPLE_DEADZONE=0
CONFIG_LPPS_ACCUM_REPORT=8
CONFIG_LPPS_INSTANT_REPORT=12
CONFIG_LPPS_ACCUM_IDLE_MS=50
CONFIG_ZMK_POINTING=y
