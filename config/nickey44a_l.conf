#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

#Bluetooth config -------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=1024

# Pointing device. Events are forwarded raw; the central listener applies processors.
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_LPPS=y
CONFIG_LPPS_JITTER_FILTER=y
# Left peripheral: stronger filter before BLE split (noise / drift mitigation)
CONFIG_LPPS_SAMPLE_DEADZONE=2
CONFIG_LPPS_ACCUM_REPORT=20
CONFIG_LPPS_INSTANT_REPORT=12
CONFIG_LPPS_ACCUM_IDLE_MS=120
CONFIG_ZMK_POINTING=y

# Layer LEDs (peripheral: tpl_led behavior from central when TrackPoint layer 4 is active)
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=1
